spring.datasource.url=jdbc:h2:mem:legaldeadline-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
legaldeadline.carga.umbral=5
legaldeadline.jwt.secret=legaldeadline-tests-secret-256-bits-only-for-tests
legaldeadline.jwt.expiration-seconds=3600
legaldeadline.demo.enabled=false
