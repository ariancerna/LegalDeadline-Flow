spring.application.name=legaldeadline-flow-backend
server.port=${SERVER_PORT:8081}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:legaldeadline}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:legaldeadline}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.data.web.pageable.max-page-size=100
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

legaldeadline.carga.umbral=${CARGA_UMBRAL:5}
legaldeadline.time-zone=America/Lima
legaldeadline.jwt.secret=${JWT_SECRET}
legaldeadline.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
legaldeadline.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
legaldeadline.demo.enabled=${DEMO_ENABLED:false}
