# Base PostgreSQL en Neon (https://neon.com). Ver docs/neon.md.
# DATABASE_URL es la cadena que copias de la consola de Neon (conexión directa, sin "pooler"):
#   DATABASE_URL=postgresql://usuario:clave@ep-xxxx.us-east-1.aws.neon.tech/neondb?sslmode=require
# Puede venir de una variable de entorno o del archivo .env de esta carpeta.
spring.config.import=optional:file:./.env[.properties]

# Neon suspende el cómputo tras 5 minutos sin conexiones; el plan gratuito cuenta las horas activas.
# Un pool que se vacía cuando no hay uso deja que la base duerma y no consuma esas horas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=0
# La primera conexión tras una suspensión tarda unos segundos mientras Neon despierta.
spring.datasource.hikari.connection-timeout=30000

# /actuator/health no consulta la base: el healthcheck de Docker la despertaría cada 15 segundos.
management.health.db.enabled=false
