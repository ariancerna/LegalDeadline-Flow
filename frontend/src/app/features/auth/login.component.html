<div class="pantalla">
  <section class="panel">
    <div class="marca">
      <span aria-hidden="true">⚖</span>
      <h1>LegalDeadline Flow</h1>
      <p class="texto-suave">Gestión de expedientes, tareas y plazos</p>
    </div>

    @if (sesionExpirada) {
      <div class="aviso aviso-alerta">Tu sesión expiró. Vuelve a iniciar sesión.</div>
    }
    @if (error(); as mensaje) {
      <div class="aviso aviso-error" role="alert">{{ mensaje }}</div>
    }

    <form class="formulario" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div
        class="campo"
        [class.invalido]="form.controls.email.invalid && form.controls.email.touched"
      >
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        <app-error-campo [control]="form.controls.email" />
      </div>
      <div
        class="campo"
        [class.invalido]="form.controls.password.invalid && form.controls.password.touched"
      >
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <app-error-campo [control]="form.controls.password" />
      </div>
      <button type="submit" class="btn btn-primario" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <details class="demo">
      <summary>Cuentas de demostración</summary>
      <div class="cuentas">
        @for (c of cuentasDemo; track c.email) {
          <button
            type="button"
            class="btn btn-secundario btn-chico"
            (click)="usarCuenta(c.email, c.password)"
          >
            {{ c.rol }}
          </button>
        }
      </div>
      <p class="texto-suave texto-chico">Disponibles cuando el backend corre con el perfil demo.</p>
    </details>
  </section>
</div>
