<div class="pagina">
  <header class="pagina-encabezado">
    <div>
      <h1>Plazos</h1>
    </div>
    <div class="acciones">
      <div class="segmentado" role="tablist" aria-label="Vista">
        <button
          type="button"
          role="tab"
          [class.activo]="vista() === 'lista'"
          (click)="cambiarVista('lista')"
        >
          Lista
        </button>
        <button
          type="button"
          role="tab"
          [class.activo]="vista() === 'calendario'"
          (click)="cambiarVista('calendario')"
        >
          Calendario
        </button>
      </div>
      @if (auth.puedeEscribir()) {
        <button type="button" class="btn btn-primario" (click)="creando.set(true)">
          <app-icono nombre="plus" [tamano]="16" />Nuevo plazo
        </button>
      }
    </div>
  </header>

  <section class="tarjeta">
    @if (vista() === 'calendario') {
      <app-plazos-calendario [version]="versionCalendario()" />
    } @else {
      <div class="pestanas" role="tablist">
        <button
          type="button"
          role="tab"
          [class.activa]="rapido() === 'porVencer'"
          (click)="atajo('porVencer')"
        >
          Por vencer
        </button>
        <button
          type="button"
          role="tab"
          [class.activa]="rapido() === 'proximos'"
          (click)="atajo('proximos')"
        >
          Próximos 10 días
        </button>
        <button
          type="button"
          role="tab"
          [class.activa]="rapido() === 'vencidos'"
          (click)="atajo('vencidos')"
        >
          Vencidos
        </button>
        <button
          type="button"
          role="tab"
          [class.activa]="rapido() === 'todos'"
          (click)="atajo('todos')"
        >
          Todos
        </button>
      </div>
      <div class="barra-filtros" role="search">
        <select
          id="f-estado"
          aria-label="Estado"
          [ngModel]="filtros().estado"
          (ngModelChange)="filtrar('estado', $event)"
        >
          <option value="">Todos los estados</option>
          @for (e of estados; track e) {
            <option [value]="e">{{ e | etiqueta }}</option>
          }
        </select>
        <span class="etiqueta-filtro">Vence</span>
        <input
          id="f-desde"
          type="date"
          aria-label="Vence desde"
          [ngModel]="filtros().desde"
          (ngModelChange)="filtrar('desde', $event)"
        />
        <span class="texto-3">–</span>
        <input
          id="f-hasta"
          type="date"
          aria-label="Vence hasta"
          [ngModel]="filtros().hasta"
          (ngModelChange)="filtrar('hasta', $event)"
        />
        @if (hayFiltros()) {
          <button type="button" class="btn btn-fantasma btn-chico" (click)="atajo('todos')">
            <app-icono nombre="x" [tamano]="14" />Limpiar
          </button>
        }
      </div>

      @if (error(); as mensaje) {
        <div class="aviso aviso-error" style="margin: 12px" role="alert">
          <app-icono nombre="circle-alert" [tamano]="16" />{{ mensaje }}
        </div>
      }

      @if (cargando() && datos().length === 0) {
        <app-esqueleto [filas]="6" />
      } @else if (datos().length === 0) {
        <app-vacio
          icono="calendar-check"
          [titulo]="
            hayFiltros() || rapido() !== 'todos'
              ? 'Sin plazos en este filtro'
              : 'No hay plazos registrados'
          "
          [texto]="
            rapido() === 'vencidos'
              ? 'Excelente: no hay plazos activos vencidos.'
              : 'Los plazos aparecerán aquí con su nivel de riesgo.'
          "
        />
      } @else {
        <app-plazos-tabla [plazos]="datos()" (cambio)="actualizado()">
          <app-paginador
            [pagina]="pagina()"
            [tamano]="tamano"
            [total]="total()"
            (cambiar)="pagina.set($event); cargar()"
          />
        </app-plazos-tabla>
      }
    }
  </section>
</div>

@if (creando()) {
  <app-dialogo
    titulo="Nuevo plazo"
    descripcion="Su riesgo se calcula automáticamente."
    icono="calendar-clock"
    [lateral]="true"
    (cerrar)="cerrarCreacion()"
  >
    <app-plazo-form (guardado)="creado()" (cancelar)="cerrarCreacion()" />
  </app-dialogo>
}
