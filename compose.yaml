name: legaldeadline-flow

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-legaldeadline}
      POSTGRES_USER: ${DB_USER:-legaldeadline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      TZ: America/Lima
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: legaldeadline-flow-backend:local
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-legaldeadline}
      DB_USER: ${DB_USER:-legaldeadline}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET de al menos 32 bytes en .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      LEGALDEADLINE_DEMO_ENABLED: ${DEMO_ENABLED:-true}
      TZ: America/Lima
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: legaldeadline-flow-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
